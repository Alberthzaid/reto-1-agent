[project]
name = "agent-qa"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.13.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pycryptodome>=3.24.0",
    "pydantic>=2.0",
    "pytesseract>=0.3.13",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
]

[project.optional-dependencies]
ui = ["gradio>=5"]

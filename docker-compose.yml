services:
  agent:
    build: .
    env_file: .env
    environment:
      # Control panel at /ui for the jury: user `admin`, password `admin` unless .env sets UI_PASSWORD.
      # The API keeps requiring TEAM_TOKEN.
      UI_ENABLED: ${UI_ENABLED:-true}
      UI_PASSWORD: ${UI_PASSWORD:-admin}
    volumes:
      - ./data:/app/data
    restart: always

  caddy:
    image: caddy:2
    depends_on:
      - agent
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: always

volumes:
  caddy_data:
  caddy_config:
  
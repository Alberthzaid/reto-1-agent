services:
  agent:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: always

  caddy:
    image: caddy:2
    depends_on:
      - agent
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: always

volumes:
  caddy_data:
  caddy_config:
  